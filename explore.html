<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore — Zenene</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--blue:#C5DCF0;--pink:#F2BFC8;--pink-d:#E8909F;--peach:#F5C9A0;--peach-d:#E8A878;--green:#A8C4A2;--green-d:#7A9E75;--cream:#FEF6ED;--text:#3D2B1F;--tl:#8A6A58;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;color:var(--text);background:var(--cream);padding-bottom:72px;}
.polka{position:fixed;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.38) 4px,transparent 4px);background-size:38px 38px;pointer-events:none;z-index:0;}

.hdr{background:rgba(254,246,237,.92);backdrop-filter:blur(14px);padding:.9rem 1.4rem;display:flex;align-items:center;gap:.8rem;position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(168,196,162,.2);}
.back{text-decoration:none;color:var(--green-d);font-size:1.3rem;}
.hdr-title{font-family:'Playfair Display',serif;font-size:1.3rem;}
.hdr-sub{font-family:'Dancing Script',cursive;font-size:.85rem;color:var(--tl);margin-left:auto;}

.main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:1.5rem 1.2rem;}

/* FEATURED */
.feat-article{background:linear-gradient(135deg,var(--peach),var(--pink));border-radius:22px;padding:1.6rem;margin-bottom:1.4rem;position:relative;overflow:hidden;cursor:pointer;}
.feat-article::before{content:'';position:absolute;top:-20px;right:-20px;width:100px;height:100px;background:rgba(255,255,255,.15);border-radius:50%;}
.feat-cat{font-size:.68rem;color:rgba(255,255,255,.85);text-transform:uppercase;font-weight:500;letter-spacing:.06em;margin-bottom:.5rem;}
.feat-h{font-family:'Playfair Display',serif;font-size:1.35rem;color:#fff;line-height:1.25;margin-bottom:.5rem;}
.feat-p{font-size:.8rem;color:rgba(255,255,255,.88);line-height:1.6;margin-bottom.7rem;}
.feat-read{font-size:.75rem;color:#fff;font-weight:500;margin-top:.8rem;display:flex;align-items:center;gap:.3rem;}

/* FILTERS */
.filter-row{display:flex;gap:.45rem;overflow-x:auto;margin-bottom:1.2rem;padding-bottom:.3rem;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.f-btn{flex-shrink:0;padding:.36rem .85rem;border-radius:50px;font-size:.75rem;border:none;background:rgba(255,255,255,.82);color:var(--tl);cursor:pointer;transition:all .2s;}
.f-btn.active{background:var(--peach-d);color:#fff;}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.85rem;}
@media(max-width:380px){.grid{grid-template-columns:1fr;}}
.art-card{background:rgba(255,255,255,.84);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 2px 12px rgba(61,43,31,.06);}
.art-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(61,43,31,.1);}
.art-emo{height:88px;display:flex;align-items:center;justify-content:center;font-size:2.2rem;}
.art-body{padding:.75rem .85rem .9rem;}
.art-cat{font-size:.6rem;text-transform:uppercase;font-weight:600;letter-spacing:.06em;margin-bottom:.3rem;}
.art-h{font-family:'Playfair Display',serif;font-size:.9rem;line-height:1.3;color:var(--text);margin-bottom:.35rem;}
.art-read{font-size:.65rem;color:var(--tl);}

/* ARTICLE MODAL */
.overlay{position:fixed;inset:0;background:rgba(42,28,18,.42);backdrop-filter:blur(8px);z-index:300;display:none;align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
.a-sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:1.5rem 1.4rem 5rem;animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet-cat{font-size:.72rem;text-transform:uppercase;font-weight:600;letter-spacing:.06em;margin-bottom:.4rem;}
.sheet-h{font-family:'Playfair Display',serif;font-size:1.4rem;line-height:1.22;margin-bottom:.5rem;}
.sheet-sub{font-size:.82rem;color:var(--tl);margin-bottom:1.2rem;font-style:italic;}
.sheet-body p{font-size:.9rem;color:var(--tl);line-height:1.76;margin-bottom:.9rem;}
.sheet-body h3{font-family:'Playfair Display',serif;font-size:1.05rem;margin:.9rem 0 .4rem;}
.sheet-close{position:sticky;top:0;float:right;background:rgba(240,235,230,.9);border:none;border-radius:50%;width:34px;height:34px;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-bottom:-.5rem;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(254,246,237,.92);backdrop-filter:blur(16px);border-top:1px solid rgba(168,196,162,.22);display:flex;justify-content:space-around;align-items:center;height:58px;padding:0 .5rem;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--tl);font-size:.58rem;padding:.35rem .5rem;border-radius:12px;transition:color .2s,transform .2s;flex:1;}
.nav-item:hover,.nav-item.active{color:var(--green-d);transform:translateY(-2px);}
.ni-emo{font-size:1.25rem;}.ni-dot{width:4px;height:4px;border-radius:50%;background:var(--green);opacity:0;margin-top:1px;}
.nav-item.active{color:var(--green-d);}.nav-item.active .ni-dot{opacity:1;}
</style>
</head>
<body>
<div class="polka"></div>

<div class="hdr">
  <a href="index.html" class="back">←</a>
  <div class="hdr-title">📚 Explore</div>
  <div class="hdr-sub">learn &amp; grow</div>
</div>

<div class="main">
  <!-- FEATURED -->
  <div class="feat-article" onclick="openArt(0)">
    <div class="feat-cat">✦ Editor's Pick</div>
    <div class="feat-h">You Are Allowed to Take Up Space</div>
    <div class="feat-p">A gentle reminder that your needs, feelings, and presence matter — more than you realise.</div>
    <div class="feat-read">Read now →</div>
  </div>

  <!-- FILTERS -->
  <div class="filter-row" id="fr"></div>

  <!-- GRID -->
  <div class="grid" id="grid"></div>
</div>

<!-- ARTICLE SHEET -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeArt()">
  <div class="a-sheet" id="asheet">
    <button class="sheet-close" onclick="closeArt()">×</button>
    <div class="sheet-cat" id="sCat"></div>
    <div class="sheet-h" id="sH"></div>
    <div class="sheet-sub" id="sSub"></div>
    <div class="sheet-body" id="sBody"></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="journal.html" class="nav-item"><div class="ni-emo">📓</div><span>Journal</span><div class="ni-dot"></div></a>
  <a href="chat.html"    class="nav-item"><div class="ni-emo">💬</div><span>Vera</span><div class="ni-dot"></div></a>
  <a href="calm.html"    class="nav-item"><div class="ni-emo">🌸</div><span>Calm</span><div class="ni-dot"></div></a>
  <a href="stories.html" class="nav-item"><div class="ni-emo">✨</div><span>Stories</span><div class="ni-dot"></div></a>
  <a href="explore.html" class="nav-item active"><div class="ni-emo">📚</div><span>Explore</span><div class="ni-dot"></div></a>
  <a href="mood.html"    class="nav-item"><div class="ni-emo">🌿</div><span>Mood</span><div class="ni-dot"></div></a>
</nav>

<script>
const CAT_COLORS={Journaling:'#E8C0CC',Anxiety:'#C5DCF0',Yoga:'#A8C4A2',Friendship:'#D4C5E8','Self-care':'#F5C9A0',Growth:'#A8C4A2'};

const ARTICLES=[
  {cat:'Growth',emo:'🌸',h:'You Are Allowed to Take Up Space',sub:'A reminder that your presence matters.',read:'3 min',bg:'#FDF0F5',
   body:`<p>From a very young age, many of us are taught — subtly or directly — to make ourselves small. To not be too loud, too emotional, too much. This piece is a gentle counter-message: <em>you are allowed to take up space.</em></p><h3>What it means</h3><p>Taking up space doesn't mean being inconsiderate. It means allowing your needs to exist. Saying "I'm struggling" when you are. Asking for what you need. Occupying your life fully.</p><h3>A practice</h3><p>This week, try one thing that feels like taking up space. Ask for help with something. Share a feeling you'd normally keep inside. Let yourself be seen — even just a little.</p><p>You are not too much. You are exactly enough. 🌸</p>`},
  {cat:'Journaling',emo:'📓',h:'10 Prompts for When You Feel Empty',sub:'Writing your way back to yourself.',read:'4 min',bg:'#FDF5F0',
   body:`<p>There are days when words feel far away and numbness moves in. These 10 prompts are designed to gently start the conversation between you and yourself.</p><h3>The prompts</h3><p>1. What does this emptiness feel like physically in my body?<br>2. When did I last feel truly present?<br>3. What would I tell a friend feeling this way?<br>4. What am I avoiding?<br>5. What would make today 1% easier?<br>6. Who made me feel safe recently — and how?<br>7. What colour is my mood right now?<br>8. What do I wish someone would ask me?<br>9. If this feeling could speak, what would it say?<br>10. What would my most compassionate self do today?</p><p>You don't have to answer all of them. One is enough to begin. 💙</p>`},
  {cat:'Anxiety',emo:'🌀',h:'Understanding Your Anxiety: A Gentle Guide',sub:'What\'s happening — and what helps.',read:'5 min',bg:'#EEF4FB',
   body:`<p>Anxiety is one of the most common experiences among teenagers — and one of the most misunderstood. Here's what's actually happening, and what can help.</p><h3>What anxiety actually is</h3><p>Anxiety is your nervous system trying to protect you. It's an ancient alarm system — and it's malfunctioning slightly in our modern world. The thoughts are not facts. The fear is real, but the threat usually isn't as certain as it feels.</p><h3>Techniques that help</h3><p><strong>4-7-8 breathing</strong> — Inhale 4s, hold 7s, exhale 8s. Activates the parasympathetic system.<br><strong>Name it to tame it</strong> — Say "I'm feeling anxious right now" out loud. It reduces amygdala activation.<br><strong>Grounding (5-4-3-2-1)</strong> — Name 5 things you see, 4 you hear, 3 you can touch, 2 you smell, 1 you taste.</p><p>Anxiety does not mean something is wrong with you. It means you care deeply. 💙</p>`},
  {cat:'Yoga',emo:'🧘',h:'Poses That Release Emotional Tension',sub:'Your body holds what your mind carries.',read:'6 min',bg:'#EFF7EE',
   body:`<p>Emotions are stored in the body — tension in the shoulders, grief in the chest, anxiety in the belly. These poses help release what words sometimes can't.</p><h3>Child's Pose (Balasana)</h3><p>Kneel, lower your torso forward, arms extended or alongside your body. Breathe deeply into your back. Hold 1–3 minutes. This is the pose of surrender — it signals safety to the nervous system.</p><h3>Legs Up the Wall (Viparita Karani)</h3><p>Lie on your back and rest your legs up against a wall. This inverted position calms the nervous system within minutes.</p><h3>Heart Opener</h3><p>Lie back over a rolled blanket or pillow under your mid-back. Open your arms wide. This pose counters the physical posture of grief and withdrawal.</p><p>You don't need a mat or experience. Your breath is the only tool required. 🌿</p>`},
  {cat:'Friendship',emo:'🤍',h:'What to Do When You Feel Alone',sub:'You are more connected than you think.',read:'4 min',bg:'#F5F0FA',
   body:`<p>Loneliness can arrive even in a room full of people. It's not about how many friends you have — it's about how seen and known you feel. Here's what helps.</p><h3>Reach out imperfectly</h3><p>Send the text. Even "hey, I've been thinking about you" is enough. Loneliness shrinks when we stop waiting for the perfect moment.</p><h3>Choose depth over breadth</h3><p>One honest conversation is worth more than ten surface-level ones. Try asking people how they're really doing — and mean it.</p><h3>Create your own ritual</h3><p>A weekly walk, a shared playlist, a standing dinner. Friendship is built in repeated small moments, not grand gestures.</p><p>You deserve to be truly known by someone. And you will be. 🤍</p>`},
  {cat:'Self-care',emo:'🛁',h:'The Art of Doing Nothing',sub:'Rest is not laziness — it\'s medicine.',read:'3 min',bg:'#FDF5ED',
   body:`<p>In a world that glorifies productivity, choosing to rest can feel radical. But rest is not laziness. It is a biological necessity — especially for the developing adolescent brain.</p><h3>What real rest looks like</h3><p>Not just sleep (though sleep matters enormously). Real rest is also: time with no purpose, creative play, boredom allowed, nature, silence, gentle movement.</p><h3>Permission slip</h3><p>You are allowed to: cancel plans to stay in. Do nothing on a Sunday. Not be productive over the weekend. Take a slow morning. Sit with a cup of tea and just exist.</p><p>Rest is an act of self-respect. It says: I am more than what I produce. 🛁</p>`},
  {cat:'Growth',emo:'🌱',h:'Tiny Habits That Changed My Mental Health',sub:'Small shifts. Real difference.',read:'4 min',bg:'#EFF7EE',
   body:`<p>You don't need to overhaul your life. The smallest habits, done consistently, create the biggest shifts.</p><h3>Morning: one thing before your phone</h3><p>Drink water. Stretch. Write one sentence. This small act reclaims your morning before the noise begins.</p><h3>Day: the 2-minute mood check</h3><p>Stop. Breathe. Ask: how am I actually feeling? Name it. That's the whole thing. Naming creates space between you and the emotion.</p><h3>Evening: three things</h3><p>Before sleep, write three things — one you're proud of, one you're grateful for, one you're releasing. This pattern trains your brain toward appreciation and closure.</p><p>These aren't magic. They're kindness — offered to yourself, daily. 🌱</p>`},
  {cat:'Anxiety',emo:'💤',h:'Why Your Sleep Matters More Than You Think',sub:'The connection between rest and mental health.',read:'4 min',bg:'#EEF4FB',
   body:`<p>Sleep is the single most impactful thing you can do for your mental health — and the most underrated.</p><h3>What happens when you sleep</h3><p>Your brain consolidates memories, processes emotions, and literally clears out metabolic waste. Teenagers need 8–10 hours. Most get 6. That gap is enormous.</p><h3>What sleep deprivation does</h3><p>It increases anxiety, reduces emotional regulation, impairs memory and decision-making, and raises cortisol (the stress hormone). When you're in a low period, the first question to ask is: am I sleeping?</p><h3>One thing to try tonight</h3><p>Set your phone to Do Not Disturb one hour before bed. Use that hour to wind down your nervous system. Even a few nights in a row creates measurable difference. 💤</p>`},
];

const CATS=['All',...new Set(ARTICLES.map(a=>a.cat))];
let selCat=null;

// Filter row
const fr=document.getElementById('fr');
CATS.forEach(c=>{
  const b=document.createElement('button');
  b.className='f-btn'+(c==='All'?' active':'');
  b.textContent=c;
  b.onclick=()=>{document.querySelectorAll('.f-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');selCat=c==='All'?null:c;renderGrid();};
  fr.appendChild(b);
});

function renderGrid(){
  const filtered=selCat?ARTICLES.filter(a=>a.cat===selCat):ARTICLES;
  document.getElementById('grid').innerHTML=filtered.map((a,i)=>`
    <div class="art-card" onclick="openArt(${ARTICLES.indexOf(a)})" style="animation:fadeUp .4s ${i*.05}s both">
      <div class="art-emo" style="background:${a.bg}">${a.emo}</div>
      <div class="art-body">
        <div class="art-cat" style="color:${CAT_COLORS[a.cat]||'#888'}">${a.cat}</div>
        <div class="art-h">${a.h}</div>
        <div class="art-read">📖 ${a.read} read</div>
      </div>
    </div>`).join('');
}

function openArt(i){
  const a=ARTICLES[i];
  document.getElementById('sCat').textContent=a.cat;
  document.getElementById('sCat').style.color=CAT_COLORS[a.cat]||'#888';
  document.getElementById('sH').textContent=a.h;
  document.getElementById('sSub').textContent=a.sub;
  document.getElementById('sBody').innerHTML=a.body;
  document.getElementById('asheet').scrollTop=0;
  document.getElementById('overlay').classList.add('open');
}
function closeArt(){document.getElementById('overlay').classList.remove('open');}

const style=document.createElement('style');
style.textContent='@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}';
document.head.appendChild(style);

renderGrid();
</script>
</body>
</html>
