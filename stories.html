<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stories — Zenene</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--blue:#C5DCF0;--pink:#F2BFC8;--pink-d:#E8909F;--peach:#F5C9A0;--green:#A8C4A2;--green-d:#7A9E75;--cream:#FEF6ED;--lav:#D4C5E8;--text:#3D2B1F;--tl:#8A6A58;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;color:var(--text);background:#F5F0FA;padding-bottom:72px;}
.polka{position:fixed;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.38) 4px,transparent 4px);background-size:38px 38px;pointer-events:none;z-index:0;}

.hdr{background:rgba(254,246,237,.92);backdrop-filter:blur(14px);padding:.9rem 1.4rem;display:flex;align-items:center;gap:.8rem;position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(168,196,162,.2);}
.back{text-decoration:none;color:var(--green-d);font-size:1.3rem;}
.hdr-title{font-family:'Playfair Display',serif;font-size:1.3rem;}
.hdr-sub{font-family:'Dancing Script',cursive;font-size:.85rem;color:var(--tl);margin-left:auto;}

.main{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:1.5rem 1.2rem;}

/* COMPOSE */
.compose-card{background:rgba(255,255,255,.82);border-radius:20px;padding:1.2rem;margin-bottom:1.4rem;box-shadow:0 4px 24px rgba(61,43,31,.08);}
.compose-h{font-family:'Playfair Display',serif;font-style:italic;font-size:1rem;color:var(--text);margin-bottom:.8rem;}
textarea.stxt{width:100%;min-height:90px;border:1px dashed #D4C5E8;border-radius:12px;padding:.7rem .9rem;font-family:'DM Sans',sans-serif;font-size:.9rem;color:var(--text);resize:none;outline:none;background:rgba(245,240,250,.4);}
textarea.stxt::placeholder{color:#BDB0C8;font-style:italic;}
.tags-row{display:flex;gap:.45rem;flex-wrap:wrap;margin:.8rem 0;}
.tag-sel-btn{padding:.3rem .75rem;border-radius:50px;font-size:.72rem;border:1.5px solid var(--lav);background:transparent;color:var(--tl);cursor:pointer;transition:all .2s;}
.tag-sel-btn.on{background:var(--lav);color:var(--text);border-color:transparent;}
.post-foot{display:flex;align-items:center;justify-content:space-between;}
.anon-note{font-size:.7rem;color:var(--tl);display:flex;align-items:center;gap:.3rem;}
.post-btn{padding:.6rem 1.5rem;background:#9E8FC0;color:#fff;border:none;border-radius:50px;font-family:'DM Sans',sans-serif;font-size:.85rem;cursor:pointer;transition:all .2s;}
.post-btn:hover{background:#8A7AAA;transform:translateY(-1px);}

/* FILTER */
.filter-row{display:flex;gap:.45rem;overflow-x:auto;margin-bottom:1.2rem;padding-bottom:.3rem;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.f-btn{flex-shrink:0;padding:.36rem .85rem;border-radius:50px;font-size:.75rem;border:none;background:rgba(255,255,255,.8);color:var(--tl);cursor:pointer;transition:all .2s;}
.f-btn.active{background:#9E8FC0;color:#fff;}

/* STORY CARD */
.story-card{background:rgba(255,255,255,.84);border-radius:18px;padding:1.1rem 1.1rem 1rem;margin-bottom:.85rem;box-shadow:0 2px 16px rgba(61,43,31,.07);animation:fadeUp .4s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.s-tag{display:inline-block;background:var(--lav);color:#5A4A78;padding:.2rem .65rem;border-radius:50px;font-size:.66rem;margin-bottom:.6rem;font-weight:500;}
.s-text{font-size:.92rem;line-height:1.7;color:var(--text);margin-bottom:.8rem;}
.s-foot{display:flex;align-items:center;gap:.8rem;}
.like-btn{background:none;border:none;cursor:pointer;font-size:.82rem;color:var(--tl);display:flex;align-items:center;gap:.3rem;padding:.2rem .4rem;border-radius:8px;transition:all .2s;}
.like-btn:hover{background:rgba(242,191,200,.3);}
.like-btn.liked{color:var(--pink-d);}
.s-time{font-size:.68rem;color:var(--tl);margin-left:auto;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(254,246,237,.92);backdrop-filter:blur(16px);border-top:1px solid rgba(168,196,162,.22);display:flex;justify-content:space-around;align-items:center;height:58px;padding:0 .5rem;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--tl);font-size:.58rem;padding:.35rem .5rem;border-radius:12px;transition:color .2s,transform .2s;flex:1;}
.nav-item:hover,.nav-item.active{color:var(--green-d);transform:translateY(-2px);}
.ni-emo{font-size:1.25rem;}.ni-dot{width:4px;height:4px;border-radius:50%;background:var(--green);opacity:0;margin-top:1px;}
.nav-item.active{color:var(--green-d);}.nav-item.active .ni-dot{opacity:1;}
</style>
</head>
<body>
<div class="polka"></div>

<div class="hdr">
  <a href="index.html" class="back">←</a>
  <div class="hdr-title">✨ Stories</div>
  <div class="hdr-sub">you are not alone</div>
</div>

<div class="main">
  <!-- COMPOSE -->
  <div class="compose-card">
    <div class="compose-h">Share your story anonymously 🤍</div>
    <textarea class="stxt" id="stxt" placeholder="Write something true, something raw, something real..."></textarea>
    <div class="tags-row" id="tagRow"></div>
    <div class="post-foot">
      <div class="anon-note">🔒 100% anonymous</div>
      <button class="post-btn" onclick="postStory()">post ✦</button>
    </div>
  </div>

  <!-- FILTER -->
  <div class="filter-row" id="filterRow"></div>

  <!-- FEED -->
  <div id="feed"></div>
</div>

<nav class="bottom-nav">
  <a href="journal.html" class="nav-item"><div class="ni-emo">📓</div><span>Journal</span><div class="ni-dot"></div></a>
  <a href="chat.html"    class="nav-item"><div class="ni-emo">💬</div><span>Vera</span><div class="ni-dot"></div></a>
  <a href="calm.html"    class="nav-item"><div class="ni-emo">🌸</div><span>Calm</span><div class="ni-dot"></div></a>
  <a href="stories.html" class="nav-item active"><div class="ni-emo">✨</div><span>Stories</span><div class="ni-dot"></div></a>
  <a href="explore.html" class="nav-item"><div class="ni-emo">📚</div><span>Explore</span><div class="ni-dot"></div></a>
  <a href="mood.html"    class="nav-item"><div class="ni-emo">🌿</div><span>Mood</span><div class="ni-dot"></div></a>
</nav>

<script>
const TAGS=['#healing','#anxiety','#school stress','#lonely','#family','#friendship','#self love','#hopeful','#venting','#proud'];

const SEED=[
  {id:1,text:"I used to think asking for help meant weakness. Now I know it's the bravest thing I've ever done.",tag:'#healing',likes:42,liked:false,time:'2h ago'},
  {id:2,text:"School has been so overwhelming lately. I just needed to say that somewhere safe. If you feel this way too, you're not alone.",tag:'#school stress',likes:87,liked:false,time:'4h ago'},
  {id:3,text:"Some days the weight of everything is too much. But I've learned that it's okay to sit with it instead of running. Feeling is healing.",tag:'#anxiety',likes:61,liked:false,time:'6h ago'},
  {id:4,text:"I wrote a letter to myself from five years ago today. I told her it gets softer. Not perfect, but softer.",tag:'#healing',likes:119,liked:false,time:'1d ago'},
  {id:5,text:"Everyone thinks I have it together. No one knows how hard I'm working to keep it that way. Sometimes I wish someone would just ask.",tag:'#lonely',likes:204,liked:false,time:'1d ago'},
  {id:6,text:"I went for a walk at sunset and cried for no reason and also for every reason. It felt kind of like a release I didn't know I needed.",tag:'#venting',likes:73,liked:false,time:'2d ago'},
  {id:7,text:"To anyone struggling with their parents not understanding: you deserve to be heard. Your feelings are valid even when they're dismissed.",tag:'#family',likes:156,liked:false,time:'3d ago'},
  {id:8,text:"I told my best friend I was struggling and she held space for me without trying to fix it. That's the kind of love I want to be for others too.",tag:'#friendship',likes:94,liked:false,time:'3d ago'},
];

const TAGS_ALL=['All',...TAGS];
let selTag=null,selPostTag=null;
let stories = [...SEED, ...JSON.parse(localStorage.getItem('z_stories')||'[]')];

// Build tag selectors (compose)
const tagRow=document.getElementById('tagRow');
TAGS.forEach(t=>{
  const b=document.createElement('button');
  b.className='tag-sel-btn';
  b.textContent=t;
  b.onclick=()=>{
    document.querySelectorAll('.tag-sel-btn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    selPostTag=t;
  };
  tagRow.appendChild(b);
});

// Filter row
const fr=document.getElementById('filterRow');
TAGS_ALL.forEach(t=>{
  const b=document.createElement('button');
  b.className='f-btn'+(t==='All'?' active':'');
  b.textContent=t;
  b.onclick=()=>{
    document.querySelectorAll('.f-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    selTag=t==='All'?null:t;
    renderFeed();
  };
  fr.appendChild(b);
});

function postStory(){
  const text=document.getElementById('stxt').value.trim();
  if(!text) return;
  const story={id:Date.now(),text,tag:selPostTag||'#healing',likes:0,liked:false,time:'just now',user:true};
  const saved=JSON.parse(localStorage.getItem('z_stories')||'[]');
  saved.unshift(story);
  localStorage.setItem('z_stories',JSON.stringify(saved));
  stories=[story,...stories];
  document.getElementById('stxt').value='';
  selPostTag=null;
  document.querySelectorAll('.tag-sel-btn').forEach(x=>x.classList.remove('on'));
  renderFeed();
}

function toggleLike(id){
  const s=stories.find(x=>x.id===id);
  if(!s) return;
  s.liked=!s.liked;
  s.likes+=s.liked?1:-1;
  renderFeed();
}

function renderFeed(){
  const feed=document.getElementById('feed');
  const filtered=selTag?stories.filter(s=>s.tag===selTag):stories;
  feed.innerHTML=filtered.map((s,i)=>{
    const safe=s.text.replace(/</g,'&lt;');
    return `<div class="story-card" style="animation-delay:${i*.04}s">
      <div class="s-tag">${s.tag}</div>
      <div class="s-text">${safe}</div>
      <div class="s-foot">
        <button class="like-btn${s.liked?' liked':''}" onclick="toggleLike(${s.id})">
          ${s.liked?'🤍':'🤍'} ${s.likes}
        </button>
        <div class="s-time">${s.time}</div>
      </div>
    </div>`;
  }).join('');
}

renderFeed();
</script>
</body>
</html>
