<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vera — Zenene</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--blue:#C5DCF0;--pink:#F2BFC8;--pink-d:#E8909F;--peach:#F5C9A0;--green:#A8C4A2;--green-d:#7A9E75;--cream:#FEF6ED;--text:#3D2B1F;--tl:#8A6A58;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--blue);display:flex;flex-direction:column;height:100dvh;overflow:hidden;}
.polka{position:fixed;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.38) 4px,transparent 4px);background-size:38px 38px;pointer-events:none;z-index:0;}

/* HEADER */
.hdr{background:rgba(254,246,237,.92);backdrop-filter:blur(14px);padding:.8rem 1.2rem;display:flex;align-items:center;gap:.9rem;border-bottom:1px solid rgba(168,196,162,.2);position:relative;z-index:10;flex-shrink:0;}
.back{text-decoration:none;color:var(--green-d);font-size:1.3rem;}
.z-av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--peach));display:flex;align-items:center;justify-content:center;font-size:1.35rem;box-shadow:0 3px 12px rgba(242,191,200,.4);}
.z-info{flex:1;}
.z-name{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:600;}
.z-status{font-size:.7rem;color:var(--green-d);display:flex;align-items:center;gap:.3rem;}
.z-dot{width:7px;height:7px;border-radius:50%;background:var(--green-d);}

/* MESSAGES */
.msgs{flex:1;overflow-y:auto;padding:1rem 1rem 1rem;display:flex;flex-direction:column;gap:.65rem;position:relative;z-index:1;}
.msg{max-width:82%;animation:msgIn .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.msg.bot{align-self:flex-start;}
.msg.usr{align-self:flex-end;}
.msg-bub{padding:.72rem 1rem;border-radius:18px;font-size:.92rem;line-height:1.56;}
.bot .msg-bub{background:rgba(255,255,255,.88);color:var(--text);border-bottom-left-radius:5px;}
.usr .msg-bub{background:var(--green);color:#fff;border-bottom-right-radius:5px;}
.msg-time{font-size:.6rem;color:var(--tl);margin-top:.18rem;padding:0 .2rem;}
.bot .msg-time{text-align:left;}
.usr .msg-time{text-align:right;}
.bot-row{display:flex;align-items:flex-end;gap:.5rem;}
.bot-av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--peach));display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0;}

/* TYPING */
.typing-bub{display:none;align-self:flex-start;}
.typing-bub .msg-bub{padding:.8rem 1rem;display:flex;gap:.3rem;align-items:center;}
.dot-t{width:7px;height:7px;border-radius:50%;background:#ccc;animation:td .8s ease-in-out infinite;}
.dot-t:nth-child(2){animation-delay:.16s}
.dot-t:nth-child(3){animation-delay:.32s}
@keyframes td{0%,100%{transform:translateY(0);background:#ccc}50%{transform:translateY(-5px);background:#A8C4A2}}

/* QUICK REPLIES */
.quick-row{display:flex;gap:.5rem;overflow-x:auto;padding:.5rem 1rem;scrollbar-width:none;position:relative;z-index:1;flex-shrink:0;}
.quick-row::-webkit-scrollbar{display:none;}
.q-chip{flex-shrink:0;background:rgba(255,255,255,.82);border-radius:50px;padding:.38rem .85rem;font-size:.75rem;color:var(--tl);cursor:pointer;border:1px solid rgba(255,255,255,.6);white-space:nowrap;transition:background .18s;}
.q-chip:hover{background:#fff;}

/* INPUT */
.inp-area{background:rgba(254,246,237,.92);backdrop-filter:blur(14px);padding:.65rem 1rem;border-top:1px solid rgba(168,196,162,.2);display:flex;align-items:flex-end;gap:.6rem;position:relative;z-index:10;flex-shrink:0;}
.inp-wrap{flex:1;background:rgba(255,255,255,.88);border-radius:24px;padding:.5rem .9rem;display:flex;align-items:flex-end;}
textarea.inp{flex:1;border:none;background:none;font-family:'DM Sans',sans-serif;font-size:.9rem;color:var(--text);resize:none;outline:none;max-height:100px;line-height:1.5;}
textarea.inp::placeholder{color:#C4AFA8;}
.send-btn{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;transition:all .2s;}
.send-btn:hover{background:var(--green-d);transform:scale(1.06);}

/* BOTTOM NAV */
.bottom-nav{background:rgba(254,246,237,.92);backdrop-filter:blur(16px);border-top:1px solid rgba(168,196,162,.22);display:flex;justify-content:space-around;align-items:center;height:58px;padding:0 .5rem;flex-shrink:0;position:relative;z-index:10;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--tl);font-size:.58rem;padding:.35rem .5rem;border-radius:12px;transition:color .2s,transform .2s;flex:1;}
.nav-item:hover,.nav-item.active{color:var(--green-d);transform:translateY(-2px);}
.ni-emo{font-size:1.25rem;transition:transform .2s;}
.nav-item:hover .ni-emo,.nav-item.active .ni-emo{transform:scale(1.12);}
.ni-dot{width:4px;height:4px;border-radius:50%;background:var(--green);opacity:0;margin-top:1px;}
.nav-item.active .ni-dot{opacity:1;}
</style>
</head>
<body>
<div class="polka"></div>

<div class="hdr">
  <a href="index.html" class="back">←</a>
  <div class="z-av">🌸</div>
  <div class="z-info">
    <div class="z-name">Vera</div>
    <div class="z-status"><div class="z-dot"></div>always here for you</div>
  </div>
</div>

<div class="msgs" id="msgs">
  <!-- seed -->
</div>

<div class="quick-row" id="qr">
  <div class="q-chip" onclick="sendQuick(this)">I'm feeling anxious</div>
  <div class="q-chip" onclick="sendQuick(this)">I feel lonely</div>
  <div class="q-chip" onclick="sendQuick(this)">I need to vent</div>
  <div class="q-chip" onclick="sendQuick(this)">School is overwhelming</div>
  <div class="q-chip" onclick="sendQuick(this)">I feel hopeless</div>
  <div class="q-chip" onclick="sendQuick(this)">I'm really stressed</div>
  <div class="q-chip" onclick="sendQuick(this)">Just checking in</div>
</div>

<div class="inp-area">
  <div class="inp-wrap">
    <textarea class="inp" id="inp" rows="1" placeholder="Type anything..." onkeydown="onKey(event)" oninput="autoGrow(this)"></textarea>
  </div>
  <button class="send-btn" onclick="sendMsg()">↑</button>
</div>

<nav class="bottom-nav">
  <a href="journal.html" class="nav-item"><div class="ni-emo">📓</div><span>Journal</span><div class="ni-dot"></div></a>
  <a href="chat.html"    class="nav-item active"><div class="ni-emo">💬</div><span>Vera</span><div class="ni-dot"></div></a>
  <a href="calm.html"    class="nav-item"><div class="ni-emo">🌸</div><span>Calm</span><div class="ni-dot"></div></a>
  <a href="stories.html" class="nav-item"><div class="ni-emo">✨</div><span>Stories</span><div class="ni-dot"></div></a>
  <a href="explore.html" class="nav-item"><div class="ni-emo">📚</div><span>Explore</span><div class="ni-dot"></div></a>
  <a href="mood.html"    class="nav-item"><div class="ni-emo">🌿</div><span>Mood</span><div class="ni-dot"></div></a>
</nav>

<script>
const BOT = {
  anxious:[
    "I can feel how unsettling that is. Anxiety has a way of making everything feel urgent and overwhelming. 💙 Can you tell me more — what's been on your mind?",
    "You're not alone in this. Anxiety is so exhausting to carry. Have you tried taking one slow breath with me right now? 🌿",
    "That makes so much sense. Sometimes anxiety is our body's way of saying something needs attention. What feels most pressing right now?"
  ],
  lonely:[
    "Loneliness is one of the hardest feelings — it can ache in such a quiet way. 🤍 I'm really glad you said something. What's been making you feel that way?",
    "You reaching out shows so much courage. Even when it feels like no one understands, I'm here and I hear you. What's going on?",
    "Thank you for sharing that with me. Feeling lonely doesn't mean you are unloved — sometimes the distance between us and others is just temporary. 💛"
  ],
  vent:[
    "Go ahead — I'm not going anywhere. This is your space to say whatever needs to be said. 🌸",
    "I'm all ears and I won't judge a single word. Let it all out — you deserve to be heard.",
    "Say everything. There's no wrong way to feel. I'm right here. 💙"
  ],
  school:[
    "School pressure can feel crushing, especially when everyone around you seems fine. What's been the hardest part lately?",
    "That makes total sense. Between classes, social stuff, and everything else — it can feel like too much. You're carrying a lot. 💙",
    "I hear you. Academic stress is so real and often dismissed. What would feel most helpful right now — venting, or thinking of small steps?"
  ],
  hopeless:[
    "I'm really glad you told me. When everything feels pointless, that's your mind and heart being really tired — not the truth about your future. 💙 Can you tell me more?",
    "Those feelings are valid and I take them seriously. You matter more than you know. If things ever feel truly dark, please reach out to a crisis line — you deserve real support too. 💙",
    "Thank you for trusting me with something so heavy. You don't have to feel this way forever, even if it seems that way right now. I'm here."
  ],
  stress:[
    "Stress has a way of stacking up until everything feels impossible. 🌿 What's weighing on you the most?",
    "That sounds really hard. Your nervous system is working overtime right now. What would help — talking it through, or just being heard?",
    "I hear you. Sometimes naming the stress is the first step to making it a little smaller. What's been going on?"
  ],
  tough:[
    "Something difficult happened... I'm here. You don't have to explain everything at once — just take your time. 💙",
    "Whatever it is, you don't have to face it alone. I'm listening. What happened?",
    "I can feel there's something heavy here. I'm right with you. Will you tell me about it?"
  ],
  calm:[
    "That's wonderful to hear 🌸 Sometimes peaceful moments are worth celebrating. What helped you get there?",
    "I love that. Holding onto calm is such a skill. What's feeling good today?",
    "A calm day is a gift. 💛 What's bringing you a sense of peace right now?"
  ],
  default:[
    "Thank you for sharing that with me. 💙 I'm here and I'm listening — how does that make you feel?",
    "I hear you. Tell me more — I want to understand what you're going through.",
    "That sounds really significant. You don't have to process this alone. What's been the hardest part?",
    "I'm so glad you reached out. 🌸 What's on your mind?"
  ]
};

function getReply(text){
  const t = text.toLowerCase();
  if(/anxi|panic|scared|worried|nervous|fear/.test(t)) return pick(BOT.anxious);
  if(/lone|alone|no one|nobody|isolat|left out/.test(t)) return pick(BOT.lonely);
  if(/vent|rant|upset|angry|mad|frustrat/.test(t)) return pick(BOT.vent);
  if(/school|study|exam|grade|class|homework|teacher/.test(t)) return pick(BOT.school);
  if(/hopeless|pointless|give up|empty|numb|worthless|meaningless/.test(t)) return pick(BOT.hopeless);
  if(/stress|overwhelm|too much|burnout/.test(t)) return pick(BOT.stress);
  if(/hard|difficult|tough|struggle|rough|painful/.test(t)) return pick(BOT.tough);
  if(/calm|good|okay|fine|peaceful|happy|great/.test(t)) return pick(BOT.calm);
  return pick(BOT.default);
}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

const msgsEl = document.getElementById('msgs');
let typingEl;

function fmt(d){return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}

function addMsg(text,who){
  const d = new Date();
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  if(who==='bot'){
    div.innerHTML=`<div class="bot-row"><div class="bot-av">🌸</div><div><div class="msg-bub">${text}</div><div class="msg-time">${fmt(d)}</div></div></div>`;
  } else {
    div.innerHTML=`<div class="msg-bub">${text}</div><div class="msg-time">${fmt(d)}</div>`;
  }
  msgsEl.appendChild(div);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function showTyping(){
  typingEl = document.createElement('div');
  typingEl.className = 'msg bot typing-bub';
  typingEl.style.display='flex';
  typingEl.innerHTML=`<div class="bot-row"><div class="bot-av">🌸</div><div class="msg-bub"><div class="dot-t"></div><div class="dot-t"></div><div class="dot-t"></div></div></div>`;
  msgsEl.appendChild(typingEl);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}
function hideTyping(){if(typingEl){typingEl.remove();typingEl=null;}}

function sendMsg(){
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if(!text) return;
  addMsg(escHtml(text),'usr');
  inp.value=''; inp.style.height='auto';
  document.getElementById('qr').style.display='none';
  setTimeout(()=>{
    showTyping();
    const delay = 900 + Math.random()*800;
    setTimeout(()=>{hideTyping(); addMsg(getReply(text),'bot');},delay);
  },120);
}

function sendQuick(el){
  document.getElementById('inp').value = el.textContent;
  sendMsg();
}

function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}
function autoGrow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px';}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// Welcome
setTimeout(()=>addMsg("Hi there 🌸 I'm Vera. This is your safe space — no judgment, just me listening. How are you feeling today?",'bot'),400);
</script>
</body>
</html>
