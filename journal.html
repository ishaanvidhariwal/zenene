<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal — Zenene</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Playfair+Display:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--blue:#C5DCF0;--pink:#F2BFC8;--pink-d:#E8909F;--peach:#F5C9A0;--green:#A8C4A2;--green-d:#7A9E75;--cream:#FEF6ED;--lav:#D4C5E8;--text:#3D2B1F;--tl:#8A6A58;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;color:var(--text);background:var(--blue);min-height:100vh;padding-bottom:72px;}
.polka{position:fixed;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.38) 4px,transparent 4px);background-size:38px 38px;pointer-events:none;z-index:0;}

/* HEADER */
.hdr{background:rgba(254,246,237,.9);backdrop-filter:blur(14px);padding:.9rem 1.4rem;display:flex;align-items:center;gap:.8rem;position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(168,196,162,.2);}
.back{text-decoration:none;color:var(--green-d);font-size:1.3rem;display:flex;align-items:center;}
.hdr-title{font-family:'Playfair Display',serif;font-size:1.3rem;}
.hdr-sub{font-family:'Dancing Script',cursive;font-size:.85rem;color:var(--tl);margin-left:auto;}

/* MAIN */
.main{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:1.5rem 1.2rem;}

/* DATE */
.date-chip{font-family:'Dancing Script',cursive;font-size:1rem;color:var(--tl);text-align:center;margin-bottom:1.2rem;}

/* MOOD */
.mood-row{display:flex;justify-content:center;gap:.6rem;margin-bottom:1.2rem;flex-wrap:wrap;}
.mood-btn{font-size:1.6rem;background:rgba(255,255,255,.6);border:2px solid transparent;border-radius:50px;padding:.3rem .55rem;cursor:pointer;transition:all .2s;line-height:1;}
.mood-btn.sel{background:rgba(255,255,255,.95);border-color:var(--green);transform:scale(1.15);box-shadow:0 4px 14px rgba(120,158,117,.25);}
.mood-label{text-align:center;font-size:.75rem;color:var(--tl);margin-bottom:1rem;min-height:1em;}

/* TEXTAREA CARD */
.write-card{background:rgba(255,255,255,.78);border-radius:20px;padding:1.2rem;box-shadow:0 4px 24px rgba(61,43,31,.08);border:1px solid rgba(255,255,255,.6);margin-bottom:1rem;}
.write-prompt{font-family:'Dancing Script',cursive;font-size:.82rem;color:var(--pink-d);margin-bottom:.5rem;}
textarea{width:100%;min-height:160px;border:none;background:none;font-family:'DM Sans',sans-serif;font-size:.95rem;color:var(--text);resize:vertical;outline:none;line-height:1.72;color:var(--tl);}
textarea::placeholder{color:#C4AFA8;font-style:italic;}
.write-foot{display:flex;align-items:center;justify-content:space-between;margin-top:.5rem;}
.char-count{font-size:.7rem;color:var(--tl);}
.save-btn{padding:.6rem 1.6rem;background:var(--green);color:#fff;border:none;border-radius:50px;font-family:'DM Sans',sans-serif;font-size:.88rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:.4rem;}
.save-btn:hover{background:var(--green-d);transform:translateY(-1px);}
.save-toast{font-size:.75rem;color:var(--green-d);font-weight:500;opacity:0;transition:opacity .3s;}
.save-toast.show{opacity:1;}

/* PROMPTS */
.prompts-row{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.3rem;margin-bottom:1.4rem;scrollbar-width:none;}
.prompts-row::-webkit-scrollbar{display:none;}
.prompt-chip{flex-shrink:0;background:rgba(255,255,255,.7);border-radius:50px;padding:.42rem .9rem;font-size:.72rem;color:var(--tl);cursor:pointer;white-space:nowrap;border:1px solid rgba(255,255,255,.6);transition:background .2s;}
.prompt-chip:hover{background:rgba(255,255,255,.95);}

/* ENTRIES */
.entries-hd{font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:.8rem;}
.entry-card{background:rgba(255,255,255,.78);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.75rem;box-shadow:0 2px 12px rgba(61,43,31,.06);border-left:3px solid var(--green);position:relative;cursor:pointer;transition:background .2s;}
.entry-card:hover{background:rgba(255,255,255,.92);}
.entry-top{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem;}
.entry-em{font-size:1.15rem;}
.entry-date{font-size:.7rem;color:var(--tl);}
.entry-text{font-size:.88rem;color:var(--tl);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.entry-del{position:absolute;top:.8rem;right:.9rem;background:none;border:none;font-size:.95rem;cursor:pointer;opacity:.35;transition:opacity .2s;}
.entry-del:hover{opacity:.8;}
.no-entries{text-align:center;padding:2rem;color:var(--tl);font-family:'Dancing Script',cursive;font-size:1rem;opacity:.7;}

/* DELETE CONFIRM */
.confirm-overlay{position:fixed;inset:0;background:rgba(61,43,31,.35);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem;}
.confirm-overlay.open{display:flex;}
.confirm-card{background:var(--cream);border-radius:20px;padding:1.6rem 1.4rem;max-width:320px;width:100%;box-shadow:0 20px 50px rgba(61,43,31,.25);text-align:center;animation:popIn .22s ease;}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.confirm-title{font-family:'Playfair Display',serif;font-size:1.15rem;margin-bottom:.4rem;}
.confirm-sub{font-size:.82rem;color:var(--tl);margin-bottom:1.3rem;line-height:1.5;}
.confirm-actions{display:flex;gap:.7rem;justify-content:center;}
.confirm-btn{flex:1;padding:.6rem 1rem;border-radius:50px;border:none;font-family:'DM Sans',sans-serif;font-size:.85rem;cursor:pointer;transition:transform .15s;}
.confirm-btn:hover{transform:translateY(-1px);}
.confirm-btn.no{background:rgba(255,255,255,.85);color:var(--tl);border:1px solid rgba(168,196,162,.3);}
.confirm-btn.yes{background:var(--pink-d);color:#fff;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(254,246,237,.92);backdrop-filter:blur(16px);border-top:1px solid rgba(168,196,162,.22);display:flex;justify-content:space-around;align-items:center;height:58px;padding:0 .5rem;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--tl);font-size:.58rem;padding:.35rem .5rem;border-radius:12px;transition:color .2s,transform .2s;flex:1;}
.nav-item:hover,.nav-item.active{color:var(--green-d);transform:translateY(-2px);}
.ni-emo{font-size:1.25rem;transition:transform .2s;}
.nav-item:hover .ni-emo,.nav-item.active .ni-emo{transform:scale(1.12);}
.ni-dot{width:4px;height:4px;border-radius:50%;background:var(--green);opacity:0;transition:opacity .2s;margin-top:1px;}
.nav-item.active .ni-dot{opacity:1;}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.ani{animation:fadeUp .5s ease both;}
.d1{animation-delay:.06s}.d2{animation-delay:.14s}.d3{animation-delay:.22s}.d4{animation-delay:.3s}
</style>
</head>
<body>
<div class="polka"></div>

<div class="hdr">
  <a href="index.html" class="back">←</a>
  <div class="hdr-title">📓 Journal</div>
  <div class="hdr-sub">your private space</div>
</div>

<div class="main">
  <div class="date-chip ani d1" id="dateLabel"></div>

  <!-- MOOD -->
  <div class="mood-row ani d2" id="moodRow">
    <button class="mood-btn" data-m="😄" data-l="Amazing">😄</button>
    <button class="mood-btn" data-m="😊" data-l="Good">😊</button>
    <button class="mood-btn" data-m="😌" data-l="Peaceful">😌</button>
    <button class="mood-btn" data-m="😐" data-l="Okay">😐</button>
    <button class="mood-btn" data-m="😔" data-l="Low">😔</button>
    <button class="mood-btn" data-m="😢" data-l="Sad">😢</button>
    <button class="mood-btn" data-m="😤" data-l="Frustrated">😤</button>
    <button class="mood-btn" data-m="😰" data-l="Anxious">😰</button>
  </div>
  <div class="mood-label" id="moodLabel">how are you feeling today?</div>

  <!-- PROMPTS -->
  <div class="prompts-row ani d2" id="promptsRow"></div>

  <!-- WRITE -->
  <div class="write-card ani d3">
    <div class="write-prompt" id="writePmt">Write whatever is on your mind...</div>
    <textarea id="ta" placeholder="Start writing... This space is only for you 🌸" oninput="onType()"></textarea>
    <div class="write-foot">
      <span class="char-count" id="cc">0 words</span>
      <div style="display:flex;align-items:center;gap:.7rem;">
        <span class="save-toast" id="toast">Saved! 🌿</span>
        <button class="save-btn" onclick="saveEntry()">save ✦</button>
      </div>
    </div>
  </div>

  <!-- PAST ENTRIES -->
  <div class="entries-hd ani d4">Past Entries</div>
  <div id="entriesList"></div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="journal.html" class="nav-item active"><div class="ni-emo">📓</div><span>Journal</span><div class="ni-dot"></div></a>
  <a href="chat.html"    class="nav-item"><div class="ni-emo">💬</div><span>Vera</span><div class="ni-dot"></div></a>
  <a href="calm.html"    class="nav-item"><div class="ni-emo">🌸</div><span>Calm</span><div class="ni-dot"></div></a>
  <a href="stories.html" class="nav-item"><div class="ni-emo">✨</div><span>Stories</span><div class="ni-dot"></div></a>
  <a href="explore.html" class="nav-item"><div class="ni-emo">📚</div><span>Explore</span><div class="ni-dot"></div></a>
  <a href="mood.html"    class="nav-item"><div class="ni-emo">🌿</div><span>Mood</span><div class="ni-dot"></div></a>
</nav>

<!-- DELETE CONFIRM MODAL -->
<div class="confirm-overlay" id="delOverlay" onclick="if(event.target===this)closeDeleteConfirm()">
  <div class="confirm-card">
    <div class="confirm-title">Delete this entry?</div>
    <div class="confirm-sub">This can't be undone — your words will be gone for good.</div>
    <div class="confirm-actions">
      <button class="confirm-btn no" onclick="closeDeleteConfirm()">No, keep it</button>
      <button class="confirm-btn yes" onclick="confirmDelete()">Yes, delete</button>
    </div>
  </div>
</div>

<script>
const PROMPTS = [
  "What made you smile today?","Write a letter to your past self.","What are you proud of lately?",
  "What feels heavy right now?","Describe how your body feels in this moment.","What do you wish someone understood about you?",
  "What would you tell a friend in your situation?","Three things you're grateful for today.",
  "What do you need more of in your life?","Where do you feel safest?"
];

let selMood = null;

// Date
const now = new Date();
document.getElementById('dateLabel').textContent = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

// Prompts
const pr = document.getElementById('promptsRow');
PROMPTS.forEach(p => {
  const el = document.createElement('button');
  el.className = 'prompt-chip';
  el.textContent = p;
  el.onclick = () => { document.getElementById('ta').value = p + '\n\n'; document.getElementById('ta').focus(); onType(); };
  pr.appendChild(el);
});

// Mood select
document.querySelectorAll('.mood-btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.mood-btn').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
    selMood = b.dataset.m;
    document.getElementById('moodLabel').textContent = 'Feeling ' + b.dataset.l.toLowerCase() + ' today';
  };
});

function onType(){
  const v = document.getElementById('ta').value.trim();
  const wc = v ? v.split(/\s+/).length : 0;
  document.getElementById('cc').textContent = wc + (wc===1?' word':' words');
}

function saveEntry(){
  const text = document.getElementById('ta').value.trim();
  if(!text) return;
  const entries = JSON.parse(localStorage.getItem('z_entries')||'[]');
  entries.unshift({id:Date.now(),text,mood:selMood||'📓',date:now.toISOString()});
  localStorage.setItem('z_entries',JSON.stringify(entries));
  document.getElementById('ta').value='';
  document.getElementById('cc').textContent='0 words';
  selMood=null;
  document.querySelectorAll('.mood-btn').forEach(x=>x.classList.remove('sel'));
  document.getElementById('moodLabel').textContent='how are you feeling today?';
  const t=document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
  renderEntries();
}

function renderEntries(){
  const entries = JSON.parse(localStorage.getItem('z_entries')||'[]');
  const el = document.getElementById('entriesList');
  if(!entries.length){el.innerHTML='<div class="no-entries">Your entries will appear here 🌱<br>Start writing something beautiful.</div>';return;}
  el.innerHTML = entries.map(e=>{
    const d = new Date(e.date);
    const ds = d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
    const safe = e.text.replace(/</g,'&lt;');
    return `<div class="entry-card">
      <div class="entry-top"><span class="entry-em">${e.mood}</span><span class="entry-date">${ds}</span></div>
      <div class="entry-text">${safe}</div>
      <button class="entry-del" onclick="deleteEntry(${e.id},event)" title="delete">🗑</button>
    </div>`;
  }).join('');
}

let pendingDeleteId = null;

function deleteEntry(id,ev){
  ev.stopPropagation();
  pendingDeleteId = id;
  document.getElementById('delOverlay').classList.add('open');
}

function closeDeleteConfirm(){
  pendingDeleteId = null;
  document.getElementById('delOverlay').classList.remove('open');
}

function confirmDelete(){
  if(pendingDeleteId===null) return;
  let entries = JSON.parse(localStorage.getItem('z_entries')||'[]');
  entries = entries.filter(e=>e.id!==pendingDeleteId);
  localStorage.setItem('z_entries',JSON.stringify(entries));
  closeDeleteConfirm();
  renderEntries();
}

renderEntries();
</script>
</body>
</html>
