<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mood — Zenene</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--blue:#C5DCF0;--pink:#F2BFC8;--pink-d:#E8909F;--peach:#F5C9A0;--green:#A8C4A2;--green-d:#7A9E75;--cream:#FEF6ED;--text:#3D2B1F;--tl:#8A6A58;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;color:var(--text);background:#EAF3FB;padding-bottom:72px;}
.polka{position:fixed;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.38) 4px,transparent 4px);background-size:38px 38px;pointer-events:none;z-index:0;}

.hdr{background:rgba(254,246,237,.92);backdrop-filter:blur(14px);padding:.9rem 1.4rem;display:flex;align-items:center;gap:.8rem;position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(168,196,162,.2);}
.back{text-decoration:none;color:var(--green-d);font-size:1.3rem;}
.hdr-title{font-family:'Playfair Display',serif;font-size:1.3rem;}
.hdr-sub{font-family:'Dancing Script',cursive;font-size:.85rem;color:var(--tl);margin-left:auto;}

.main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:1.5rem 1.2rem;}

/* CHECK IN */
.ci-card{background:rgba(255,255,255,.84);border-radius:22px;padding:1.5rem 1.3rem;margin-bottom:1.3rem;box-shadow:0 4px 24px rgba(61,43,31,.08);text-align:center;}
.ci-h{font-family:'Playfair Display',serif;font-size:1.15rem;margin-bottom:.3rem;}
.ci-sub{font-size:.8rem;color:var(--tl);margin-bottom:1.2rem;}
.ci-moods{display:flex;justify-content:center;gap:.7rem;margin-bottom.8rem;flex-wrap:wrap;}
.m-opt{display:flex;flex-direction:column;align-items:center;gap:.25rem;cursor:pointer;padding:.4rem .5rem;border-radius:14px;transition:background .18s,transform .18s;border:2px solid transparent;}
.m-opt:hover{background:rgba(197,220,240,.3);}
.m-opt.sel{background:rgba(197,220,240,.5);border-color:var(--blue);transform:scale(1.08);}
.m-emo{font-size:2rem;}
.m-lbl{font-size:.58rem;color:var(--tl);}
.ci-note{width:100%;border:1px dashed #C5DCF0;border-radius:12px;padding:.65rem .8rem;font-family:'DM Sans',sans-serif;font-size:.85rem;color:var(--text);resize:none;outline:none;min-height:60px;background:rgba(197,220,240,.12);margin:.9rem 0;}
.ci-note::placeholder{color:#AACCE0;font-style:italic;}
.log-btn{width:100%;padding:.7rem;background:var(--green);color:#fff;border:none;border-radius:50px;font-family:'DM Sans',sans-serif;font-size:.9rem;cursor:pointer;transition:all .2s;}
.log-btn:hover{background:var(--green-d);}
.ci-toast{font-size:.75rem;color:var(--green-d);text-align:center;margin-top:.5rem;min-height:1.1em;font-weight:500;}

/* CHART */
.chart-card{background:rgba(255,255,255,.84);border-radius:22px;padding:1.3rem;margin-bottom:1.3rem;box-shadow:0 4px 24px rgba(61,43,31,.08);}
.chart-h{font-family:'Playfair Display',serif;font-size:1.05rem;margin-bottom:1rem;}
.chart-wrap{display:flex;align-items:flex-end;gap:.5rem;height:120px;padding-bottom:.3rem;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:.3rem;}
.bar-fill{width:100%;border-radius:6px 6px 0 0;min-height:4px;transition:height .5s cubic-bezier(.34,1.56,.64,1);}
.bar-day{font-size:.6rem;color:var(--tl);}
.bar-emo{font-size:.9rem;}
.no-data{text-align:center;color:var(--tl);font-size:.8rem;padding:1.5rem;font-family:'Dancing Script',cursive;font-style:italic;}

/* INSIGHT */
.insight-card{background:linear-gradient(135deg,var(--peach),var(--pink));border-radius:22px;padding:1.3rem;margin-bottom:1.3rem;}
.ins-h{font-family:'Dancing Script',cursive;font-size:1.1rem;color:#fff;margin-bottom:.3rem;}
.ins-p{font-size:.82rem;color:rgba(255,255,255,.9);line-height:1.6;}

/* LOG */
.log-card{background:rgba(255,255,255,.84);border-radius:22px;padding:1.3rem;box-shadow:0 4px 24px rgba(61,43,31,.08);}
.log-h{font-family:'Playfair Display',serif;font-size:1.05rem;margin-bottom:.9rem;}
.log-item{display:flex;align-items:center;gap:.8rem;padding:.7rem 0;border-bottom:1px solid rgba(197,220,240,.3);}
.log-item:last-child{border-bottom:none;}
.li-emo{font-size:1.5rem;}
.li-info{flex:1;}
.li-date{font-size:.72rem;color:var(--tl);}
.li-note{font-size:.82rem;color:var(--text);margin-top:.1rem;}
.li-mood{font-size:.7rem;color:var(--green-d);font-weight:500;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(254,246,237,.92);backdrop-filter:blur(16px);border-top:1px solid rgba(168,196,162,.22);display:flex;justify-content:space-around;align-items:center;height:58px;padding:0 .5rem;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--tl);font-size:.58rem;padding:.35rem .5rem;border-radius:12px;transition:color .2s,transform .2s;flex:1;}
.nav-item:hover,.nav-item.active{color:var(--green-d);transform:translateY(-2px);}
.ni-emo{font-size:1.25rem;}.ni-dot{width:4px;height:4px;border-radius:50%;background:var(--green);opacity:0;margin-top:1px;}
.nav-item.active{color:var(--green-d);}.nav-item.active .ni-dot{opacity:1;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.ani{animation:fadeUp .45s ease both;}
.d1{animation-delay:.06s}.d2{animation-delay:.14s}.d3{animation-delay:.22s}.d4{animation-delay:.3s}
</style>
</head>
<body>
<div class="polka"></div>

<div class="hdr">
  <a href="index.html" class="back">←</a>
  <div class="hdr-title">🌿 Mood Tracker</div>
  <div class="hdr-sub">check in with yourself</div>
</div>

<div class="main">
  <!-- CHECK IN -->
  <div class="ci-card ani d1">
    <div class="ci-h">How are you feeling right now?</div>
    <div class="ci-sub">Select what resonates most.</div>
    <div class="ci-moods" id="ciMoods"></div>
    <textarea class="ci-note" id="ciNote" rows="2" placeholder="Add a note about your day (optional)..."></textarea>
    <button class="log-btn" onclick="logMood()">log my mood ✦</button>
    <div class="ci-toast" id="ciToast"></div>
  </div>

  <!-- CHART -->
  <div class="chart-card ani d2">
    <div class="chart-h">Your week at a glance</div>
    <div class="chart-wrap" id="chartWrap"></div>
  </div>

  <!-- INSIGHT -->
  <div class="insight-card ani d3" id="insightCard" style="display:none;">
    <div class="ins-h" id="insH"></div>
    <div class="ins-p" id="insP"></div>
  </div>

  <!-- LOG -->
  <div class="log-card ani d4">
    <div class="log-h">Recent log</div>
    <div id="logList"></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="journal.html" class="nav-item"><div class="ni-emo">📓</div><span>Journal</span><div class="ni-dot"></div></a>
  <a href="chat.html"    class="nav-item"><div class="ni-emo">💬</div><span>Vera</span><div class="ni-dot"></div></a>
  <a href="calm.html"    class="nav-item"><div class="ni-emo">🌸</div><span>Calm</span><div class="ni-dot"></div></a>
  <a href="stories.html" class="nav-item"><div class="ni-emo">✨</div><span>Stories</span><div class="ni-dot"></div></a>
  <a href="explore.html" class="nav-item"><div class="ni-emo">📚</div><span>Explore</span><div class="ni-dot"></div></a>
  <a href="mood.html"    class="nav-item active"><div class="ni-emo">🌿</div><span>Mood</span><div class="ni-dot"></div></a>
</nav>

<script>
const MOODS=[
  {emo:'😄',lbl:'Amazing',score:5,color:'#A8C4A2'},
  {emo:'😊',lbl:'Good',score:4,color:'#C5DCF0'},
  {emo:'😌',lbl:'Peaceful',score:4,color:'#D4C5E8'},
  {emo:'😐',lbl:'Okay',score:3,color:'#F5C9A0'},
  {emo:'😔',lbl:'Low',score:2,color:'#F2BFC8'},
  {emo:'😢',lbl:'Sad',score:1,color:'#E8909F'},
  {emo:'😤',lbl:'Frustrated',score:2,color:'#F5C9A0'},
  {emo:'😰',lbl:'Anxious',score:2,color:'#C5DCF0'},
];

const INSIGHTS=[
  {h:'You\'re showing up 🌿',p:'Tracking your mood takes courage and self-awareness. Every log is an act of self-care.'},
  {h:'Patterns hold wisdom 🌸',p:'Your moods through the week tell a story. Notice what helps — and what makes things harder.'},
  {h:'Every feeling is valid 💙',p:'High moods, low moods, in-between moods — they all belong. You\'re doing beautifully.'},
  {h:'Small steps matter ✦',p:'You\'re building a habit of self-awareness. That\'s one of the most powerful things you can do for your mental health.'},
];

let selMood=null;

// Build mood grid
const ciM=document.getElementById('ciMoods');
MOODS.forEach(m=>{
  const d=document.createElement('div');
  d.className='m-opt';
  d.innerHTML=`<div class="m-emo">${m.emo}</div><div class="m-lbl">${m.lbl}</div>`;
  d.onclick=()=>{
    document.querySelectorAll('.m-opt').forEach(x=>x.classList.remove('sel'));
    d.classList.add('sel'); selMood=m;
  };
  ciM.appendChild(d);
});

function logMood(){
  if(!selMood){showToast('Select a mood first 🌸','#E8A878');return;}
  const note=document.getElementById('ciNote').value.trim();
  const entry={emo:selMood.emo,lbl:selMood.lbl,score:selMood.score,color:selMood.color,note,date:new Date().toISOString()};
  const moods=JSON.parse(localStorage.getItem('z_moods')||'[]');
  moods.unshift(entry);
  localStorage.setItem('z_moods',JSON.stringify(moods.slice(0,90)));
  selMood=null;
  document.querySelectorAll('.m-opt').forEach(x=>x.classList.remove('sel'));
  document.getElementById('ciNote').value='';
  showToast('Logged! 🌿','#7A9E75');
  render();
}

function showToast(msg,color){
  const t=document.getElementById('ciToast');
  t.textContent=msg; t.style.color=color;
  setTimeout(()=>t.textContent='',2500);
}

function render(){
  renderChart();
  renderLog();
  renderInsight();
}

function renderChart(){
  const moods=JSON.parse(localStorage.getItem('z_moods')||'[]');
  const wrap=document.getElementById('chartWrap');
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const today=new Date();
  const cols=[];
  for(let i=6;i>=0;i--){
    const d=new Date(today); d.setDate(today.getDate()-i);
    const ds=d.toDateString();
    const dayEntries=moods.filter(m=>new Date(m.date).toDateString()===ds);
    const avg=dayEntries.length?Math.round(dayEntries.reduce((s,m)=>s+m.score,0)/dayEntries.length):0;
    const lastEmo=dayEntries[0]?.emo||'';
    const color=dayEntries[0]?.color||'#EDE5E0';
    cols.push({day:days[d.getDay()],avg,emo:lastEmo,color,has:dayEntries.length>0});
  }
  const maxScore=5;
  wrap.innerHTML=cols.map(c=>`
    <div class="bar-col">
      <div class="bar-emo">${c.emo}</div>
      <div class="bar-fill" style="height:${c.has?(c.avg/maxScore*100):4}%;background:${c.color};"></div>
      <div class="bar-day">${c.day}</div>
    </div>`).join('');
}

function renderLog(){
  const moods=JSON.parse(localStorage.getItem('z_moods')||'[]');
  const el=document.getElementById('logList');
  if(!moods.length){el.innerHTML='<div style="text-align:center;color:var(--tl);font-size:.8rem;padding:1rem;font-family:Dancing Script,cursive;font-style:italic;">Your mood log will appear here 🌱</div>';return;}
  el.innerHTML=moods.slice(0,14).map(m=>{
    const d=new Date(m.date);
    const ds=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+' · '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    return `<div class="log-item">
      <div class="li-emo">${m.emo}</div>
      <div class="li-info">
        <div class="li-date">${ds}</div>
        <div class="li-mood">${m.lbl}</div>
        ${m.note?`<div class="li-note">${m.note.replace(/</g,'&lt;')}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

function renderInsight(){
  const moods=JSON.parse(localStorage.getItem('z_moods')||'[]');
  const card=document.getElementById('insightCard');
  if(moods.length<2){card.style.display='none';return;}
  card.style.display='block';
  const ins=INSIGHTS[Math.floor(moods.length/3)%INSIGHTS.length];
  document.getElementById('insH').textContent=ins.h;
  document.getElementById('insP').textContent=ins.p;
}

render();
</script>
</body>
</html>
